{% extends 'base.html' %}

{% block title %}Edit Monthly Donor - SKSSF Administration{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[80vh]">
    <div class="container mx-auto px-4 max-w-[600px]">
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.05)]">
            <h2 class="text-[1.5rem] text-textmain mb-6 pb-2.5 border-b-2 border-slate-200 font-bold"><i class="fas fa-edit mr-2 text-[#10b981]"></i> Edit Donor: {{ donor.name }}</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Full Name</label>
                    {{ form.name }}
                </div>
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Phone Number</label>
                    {{ form.phone }}
                </div>
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Monthly Commitment (₹)</label>
                    {{ form.monthly_commitment }}
                </div>
                <div class="mb-5 flex items-center gap-2.5">
                    {{ form.is_active }} <label class="m-0 font-semibold text-textmuted text-[0.9rem]">Active Donor</label>
                </div>
                <button type="submit" class="w-full p-3 bg-primary text-white border-none rounded-lg font-bold cursor-pointer mt-4 transition-colors hover:bg-[#059669]">Save Changes</button>
                <a href="{% url 'manage_monthly_donors' %}" class="w-full p-3 bg-slate-400 text-white border-none rounded-lg font-bold cursor-pointer mt-2 block text-center no-underline transition-colors hover:bg-slate-500">Cancel</a>
            </form>
        </div>
    </div>
</div>

<style>
    /* Styling for Django generated forms in this page */
    form input, form select, form textarea {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
    }
    form input:focus, form select:focus, form textarea:focus {
        border-color: #10b981;
    }
</style>
{% endblock %}
