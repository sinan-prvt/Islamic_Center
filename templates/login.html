{% extends 'base.html' %}

{% block title %}Admin Login - SKSSF Puthupparamba{% endblock %}

{% block content %}
<div class="py-24 bg-slate-50 min-h-[70vh] flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.05)] p-8 md:p-12 w-full max-w-[450px] mx-4 md:mx-auto">
        <div class="text-center mb-10">
            <i class="fas fa-lock text-[3rem] text-primary mb-4 block"></i>
            <h2 class="text-textmain text-[1.4rem] m-0 font-bold">Admin Secure Login</h2>
        </div>

        {% if form.errors %}
        <div class="bg-red-50 text-red-500 p-4 rounded-md mb-6 text-[0.9rem] text-center font-semibold">
            Your username and password didn't match. Please try again.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" id="loginForm">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="id_username" class="block mb-2 text-textmain font-bold">Username</label>
                <input type="text" name="username" class="w-full px-4 py-3 border border-slate-200 rounded-md text-base transition-colors focus:outline-none focus:border-primary" id="id_username" required autofocus>
            </div>
            
            <div class="mb-6">
                <label for="id_password" class="block mb-2 text-textmain font-bold">Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 border border-slate-200 rounded-md text-base transition-colors focus:outline-none focus:border-primary" id="id_password" required>
            </div>

            <button type="submit" class="w-full p-4 bg-primary text-white border-none rounded-md text-[1.1rem] font-bold cursor-pointer transition-colors hover:bg-[#064e3b] mt-4" id="login-btn">Login to Dashboard</button>
            <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
        </form>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    var btn = document.getElementById('login-btn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';
    btn.style.opacity = '0.7';
    btn.style.pointerEvents = 'none';
});
</script>
{% endblock %}
