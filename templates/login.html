{% extends 'base.html' %}

{% block title %}Admin Login - SKSSF Puthupparamba{% endblock %}

{% block content %}
<style>
    .login-section {
        padding: 6rem 0;
        background: #f8fafc;
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        padding: 3rem;
        width: 100%;
        max-width: 450px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .login-header i {
        font-size: 3rem;
        color: var(--primary);
        margin-bottom: 1rem;
    }

    .login-header h2 {
        color: var(--text-main);
        font-size: 1.8rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-main);
        font-weight: 600;
    }

    .form-control {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary);
    }

    .btn-login {
        width: 100%;
        padding: 1rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease;
        margin-top: 1rem;
    }

    .btn-login:hover {
        background: var(--primary-dark);
    }

    .error-msg {
        background: #fef2f2;
        color: #ef4444;
        padding: 1rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        text-align: center;
    }
</style>

<div class="login-section">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-lock"></i>
            <h2>Admin Secure Login</h2>
        </div>

        {% if form.errors %}
        <div class="error-msg">
            Your username and password didn't match. Please try again.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>

            <button type="submit" class="btn-login">Login to Dashboard</button>
            <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
        </form>
    </div>
</div>
{% endblock %}
