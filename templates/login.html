{% extends 'base.html' %}
{% load static %}

{% block meta_title %}Admin Login - SKSSF Puthupparamba{% endblock %}

{% block content %}
<div class="neumorphic-login-body py-12 md:py-20 min-h-[85vh] flex items-center justify-center bg-[#e8e8e8]">
    <div class="login-wrapper">
        <div class="glass-circle">
            <div class="accent-ring"></div>

            <form class="login-form" method="post" action="{% url 'login' %}" id="loginForm">
                {% csrf_token %}
                <h1>Login</h1>
                <div class="subtitle">SKSSF Portal & Admin Access</div>

                {% if form.errors %}
                <div class="error-msg">
                    Invalid username or password.
                </div>
                {% endif %}

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Username" autocomplete="off" required autofocus id="id_username">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" autocomplete="off" required id="id_password">
                </div>

                <div class="forgot">
                    <div class="remember">
                        <div class="switch" id="rememberSwitch"></div>
                        Remember me
                    </div>
                    <a href="{% url 'contact' %}">Need help?</a>
                </div>

                <button type="submit" id="login-btn">Sign In</button>
                <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
            </form>
        </div>
    </div>
</div>

<style>
/* =========================
       NEUMORPHIC SPECIFIC
========================= */

.login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.glass-circle {
    position: relative;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8e8e8;
    box-shadow:
        -22px -22px 44px #ffffff,
        22px 22px 50px #c3c3c3,
        -1px -1px 1px rgba(255,255,255,.5) inset;
    z-index: 5;
}

.glass-circle::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.65);
    box-shadow:
        inset 3px 3px 9px rgba(163, 163, 163, 0.18),
        inset -3px -3px 9px rgba(255, 255, 255, 0.7);
    pointer-events: none;
}

.login-form {
    position: relative;
    width: 290px;
    z-index: 10;
}

.login-form h1 {
    color: #045a33;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 4px;
    text-align: center;
    text-shadow:
        1px 1px 1px rgba(255, 255, 255, 0.9),
        -2px -2px 1px rgba(163, 163, 163, 0.25);
}

.login-form .subtitle {
    text-align: center;
    color: #787878;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .3px;
    margin-bottom: 28px;
}

.error-msg {
    background: #fee2e2;
    color: #dc2626;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    box-shadow: inset 2px 2px 5px rgba(220,38,38,0.15);
}

.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-box i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #909090;
    font-size: 15px;
    z-index: 2;
    transition: color .35s ease;
    pointer-events: none;
}

.input-box input {
    width: 100%;
    height: 46px;
    padding-top: 0;
    padding-right: 16px;
    padding-bottom: 0;
    padding-left: 48px !important;
    border: none;
    outline: none;
    background: #e8e8e8;
    color: #2d3748;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: .2px;
    border-radius: 12px;
    box-shadow:
        inset -6px -6px 10px rgba(255,255,255,.95),
        inset 6px 6px 10px rgba(184,190,204,.45);
    transition: box-shadow .4s cubic-bezier(.22,1,.36,1), transform .4s cubic-bezier(.22,1,.36,1);
}

.input-box input::placeholder {
    color: #a3a3a3;
    font-weight: 400;
}

.input-box input:focus {
    transform: translateY(-2px);
    box-shadow:
        inset 3px 3px 6px rgba(4,90,51,.35),
        inset -3px -3px 6px rgba(16,185,129,.25);
}

.input-box input:focus + i,
.input-box:focus-within i {
    color: #045a33;
}

.forgot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: -1px;
    margin-bottom: 30px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #787878;
    font-weight: 500;
}

.switch {
    position: relative;
    width: 32px;
    height: 18px;
    border-radius: 20px;
    background: #e8e8e8;
    box-shadow:
        inset 3px 3px 6px rgba(184,190,204,.5),
        inset -3px -3px 6px rgba(255,255,255,.9);
    cursor: pointer;
    flex-shrink: 0;
}

.switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e8e8e8;
    box-shadow: 1px 1px 3px rgba(0,0,0,.25);
    transition: left .25s ease, background .25s ease;
}

.switch.on {
    box-shadow:
        inset 3px 3px 6px rgba(4,90,51,.35),
        inset -3px -3px 6px rgba(251,191,36,.25);
}

.switch.on::after {
    left: 16px;
    background: #045a33;
}

.forgot a {
    font-size: 12px;
    color: #787878;
    text-decoration: none;
    transition: color .3s ease;
    font-weight: 500;
}

.forgot a:hover {
    color: #045a33;
}

.login-form button {
    position: relative;
    width: 100%;
    height: 44px;
    display: block;
    margin: auto;
    overflow: hidden;
    border: none;
    outline: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #555;
    background: #e8e8e8;
    box-shadow:
        -7px -7px 12px #f8f8f8,
         7px 7px 12px #c8c8c8;
    transition: color .4s ease, background .4s ease, box-shadow .4s ease, transform .25s ease;
}

.login-form button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
    transition: left .6s ease;
}

.login-form button:hover::before {
    left: 130%;
}

.login-form button:hover {
    transform: translateY(-2px);
    color: #ffffff;
    background: linear-gradient(155deg, #045a33 0%, #064e3b 100%);
    box-shadow:
        0 10px 22px rgba(4, 90, 51, 0.35),
        -5px -5px 15px rgba(255, 255, 255, 0.6),
        inset 0 1px 1px rgba(255,255,255,.25);
}

.login-form button:active {
    transform: translateY(0) scale(0.97);
    box-shadow:
        inset 5px 5px 10px rgba(4, 40, 25, 0.4),
        inset -5px -5px 10px rgba(251, 191, 36, 0.2);
}

/* =========================
        RESPONSIVE MOBILE STYLES
========================= */

@media (max-width: 600px) {
    .neumorphic-login-body {
        padding-top: 2rem;
        padding-bottom: 4rem;
        min-h: calc(100vh - 120px);
    }
    .login-wrapper {
        padding: 0 16px;
    }
    .glass-circle {
        width: 100%;
        max-width: 360px;
        height: auto;
        min-height: 420px;
        border-radius: 36px;
        padding: 40px 24px;
        box-shadow:
            -12px -12px 25px #ffffff,
            12px 12px 30px #c3c3c3,
            -1px -1px 1px rgba(255,255,255,.5) inset;
    }
    .glass-circle::before {
        border-radius: 28px;
        inset: 8px;
    }
    .login-form {
        width: 100%;
        max-width: 280px;
    }
    .login-form h1 {
        font-size: 32px;
    }
    .login-form .subtitle {
        font-size: 12px;
        margin-bottom: 22px;
    }
    .input-box {
        margin-bottom: 16px;
    }
    .input-box input {
        height: 44px;
        font-size: 13.5px;
        padding-left: 46px !important;
    }
    .input-box i {
        left: 15px;
        font-size: 14px;
    }
    .forgot {
        margin-bottom: 22px;
    }
    .forgot a, .remember {
        font-size: 11px;
    }
    .login-form button {
        height: 44px;
        font-size: 13.5px;
        border-radius: 12px;
    }
}

@media (max-width: 380px) {
    .glass-circle {
        max-width: 310px;
        padding: 32px 18px;
        border-radius: 28px;
    }
    .glass-circle::before {
        border-radius: 22px;
        inset: 6px;
    }
    .login-form h1 {
        font-size: 28px;
    }
    .login-form .subtitle {
        font-size: 11px;
        margin-bottom: 18px;
    }
    .input-box input {
        height: 40px;
        font-size: 12px;
        padding-left: 42px !important;
    }
    .input-box i {
        left: 13px;
        font-size: 13px;
    }
    .forgot a, .remember {
        font-size: 10px;
    }
    .login-form button {
        height: 40px;
        font-size: 12px;
    }
}
</style>

<script>
    document.getElementById('rememberSwitch').addEventListener('click', function () {
        this.classList.toggle('on');
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        var btn = document.getElementById('login-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Signing In...';
        btn.style.opacity = '0.8';
        btn.style.pointerEvents = 'none';
    });
</script>
{% endblock %}
