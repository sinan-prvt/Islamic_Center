{% extends 'base.html' %}

{% block title %}Edit Gallery Image - SKSSF Administration{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[80vh]">
    <div class="container mx-auto px-4 max-w-[600px]">
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.05)]">
            <h2 class="text-[1.5rem] text-textmain mb-6 pb-2.5 border-b-2 border-slate-200 font-bold"><i class="fas fa-edit mr-2 text-[#f59e0b]"></i> Edit Gallery Image</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Title / Caption</label>
                    {{ form.title }}
                </div>
                
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Current Image</label>
                    <div class="mb-2.5">
                        <img src="{{ image.image.url }}" class="max-w-full rounded-md border border-slate-200" loading="lazy">
                    </div>
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Change Image</label>
                    {{ form.image }}
                </div>
                
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Link to Program</label>
                    {{ form.program }}
                </div>
                <button type="submit" class="w-full p-3 bg-amber-500 text-white border-none rounded-lg font-bold cursor-pointer mt-4 transition-colors hover:bg-amber-600">Save Changes</button>
                <a href="{% url 'manage_gallery' %}" class="w-full p-3 bg-slate-400 text-white border-none rounded-lg font-bold cursor-pointer mt-2 block text-center no-underline transition-colors hover:bg-slate-500">Cancel</a>
            </form>
        </div>
    </div>
</div>

<style>
    /* Styling for Django generated forms in this page */
    form input, form select, form textarea {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
    }
    form input:focus, form select:focus, form textarea:focus {
        border-color: #f59e0b;
    }
</style>
{% endblock %}
