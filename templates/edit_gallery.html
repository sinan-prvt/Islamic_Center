{% extends 'base.html' %}

{% block title %}Edit Gallery Image - SKSSF Administration{% endblock %}

{% block content %}
<style>
    .manage-section { padding: 4rem 0; background: #f8fafc; min-height: 80vh; }
    .container-small { max-width: 600px; margin: 0 auto; }
    .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .form-card h2 { font-size: 1.5rem; color: var(--text-main); margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;}
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
    .form-control { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; }
    .form-control:focus { border-color: #f59e0b; outline: none; }
    .btn-submit { width: 100%; padding: 1rem; background: #f59e0b; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 1rem; transition: background 0.3s; }
    .btn-submit:hover { background: #d97706; }
    .btn-cancel { width: 100%; padding: 1rem; background: #94a3b8; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; display: block; text-align: center; text-decoration: none; }
</style>

<div class="manage-section">
    <div class="container container-small">
        <div class="form-card">
            <h2><i class="fas fa-edit"></i> Edit Gallery Image</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group"><label>Title / Caption</label>{{ form.title }}</div>
                
                <div class="form-group">
                    <label>Current Image</label>
                    <div style="margin-bottom: 10px;">
                        <img src="{{ image.image.url }}" style="max-width: 100%; border-radius: 6px; border: 1px solid #e2e8f0;" loading="lazy">
                    </div>
                    <label>Change Image</label>
                    {{ form.image }}
                </div>
                
                <div class="form-group"><label>Link to Program</label>{{ form.program }}</div>
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{% url 'manage_gallery' %}" class="btn-cancel">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
