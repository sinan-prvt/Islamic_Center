{% extends 'base.html' %}
{% block title %}Monthly Fund - SKSSF Puthupparamba{% endblock %}

{% block content %}
<div class="bg-primary text-white py-[3rem] md:py-[4rem] px-[5%] text-center relative">
    <div class="banner-content">
        <h1 class="text-[2rem] md:text-[2.8rem] mb-2 font-outfit font-bold">Support Our Cause</h1>
        <div class="text-[0.95rem] opacity-90">
            <a href="{% url 'home' %}" class="text-white no-underline mr-[5px] hover:underline">Home</a> | Donate
        </div>
    </div>
</div>

<div class="container mx-auto px-4 mt-12 mb-16 max-w-[800px]">
    <!-- Card 1: Monthly Fund -->
    <div class="bg-white p-8 md:p-12 rounded-[20px] shadow-[0_4px_15px_rgba(0,0,0,0.05)] text-center border border-[rgba(0,0,0,0.05)] border-t-[5px] border-t-primary w-full mx-auto">
        <div>
            <h2 class="text-[1.5rem] md:text-[1.8rem] text-textmain mb-4 font-bold">Monthly Unit Fund</h2>
            <p class="text-textmuted mb-8 text-[0.95rem] md:text-[1.05rem]">Contribute to our regular educational and relief programs.</p>
            
            <!-- Step 1: Identification -->
            <div id="step-identify" class="text-left bg-slate-50 p-6 md:p-8 rounded-xl border border-slate-200">
                <div class="mb-4">
                    <label class="block mb-2 font-semibold text-textmain">Full Name</label>
                    <input type="text" id="donorName" class="w-full p-3 border border-slate-300 rounded-lg outline-none font-inherit focus:border-primary focus:shadow-[0_0_0_3px_rgba(15,81,50,0.1)]" placeholder="Enter your name">
                </div>
                <div class="mb-6">
                    <label class="block mb-2 font-semibold text-textmain">Phone Number</label>
                    <input type="text" id="donorPhone" class="w-full p-3 border border-slate-300 rounded-lg outline-none font-inherit focus:border-primary focus:shadow-[0_0_0_3px_rgba(15,81,50,0.1)]" placeholder="Enter your phone number">
                </div>
                <button onclick="checkAndProceed()" class="w-full bg-primary text-white border-none p-4 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-[#044324] text-[1.1rem]">Check Details & Pay</button>
                <div id="identify-error" class="hidden mt-4 p-3 rounded-md bg-red-100 text-red-800 border border-red-200"></div>
            </div>

            <!-- Step 2: Payment Section (Hidden Initially) -->
            <div id="step-pay" class="hidden text-left mt-8">
                <div id="contribution-status" class="bg-[#d1fae5] border border-[#a7f3d0] p-6 rounded-xl mb-8">
                    <!-- Status text injected via JS -->
                </div>

                <h3 class="text-[1.2rem] text-textmain mb-4 text-center font-bold">Select Payment Amount</h3>
                <div class="grid grid-cols-3 gap-2 md:gap-3 mb-6">
                    <button class="bg-slate-100 text-textmain border border-slate-300 p-2 md:p-3 rounded-lg font-semibold cursor-pointer transition-all duration-200 hover:bg-primary hover:text-white hover:border-primary text-[0.85rem] md:text-[1rem]" onclick="alert('Payment Gateway Integration Pending')">₹30</button>
                    <button class="bg-slate-100 text-textmain border border-slate-300 p-2 md:p-3 rounded-lg font-semibold cursor-pointer transition-all duration-200 hover:bg-primary hover:text-white hover:border-primary text-[0.85rem] md:text-[1rem]" onclick="alert('Payment Gateway Integration Pending')">₹50</button>
                    <button class="bg-slate-100 text-textmain border border-slate-300 p-2 md:p-3 rounded-lg font-semibold cursor-pointer transition-all duration-200 hover:bg-primary hover:text-white hover:border-primary text-[0.85rem] md:text-[1rem]" onclick="alert('Payment Gateway Integration Pending')">₹100</button>
                    <button class="bg-slate-100 text-textmain border border-slate-300 p-2 md:p-3 rounded-lg font-semibold cursor-pointer transition-all duration-200 hover:bg-primary hover:text-white hover:border-primary text-[0.85rem] md:text-[1rem]" onclick="alert('Payment Gateway Integration Pending')">₹200</button>
                    <button class="bg-slate-100 text-textmain border border-slate-300 p-2 md:p-3 rounded-lg font-semibold cursor-pointer transition-all duration-200 hover:bg-primary hover:text-white hover:border-primary text-[0.85rem] md:text-[1rem]" onclick="alert('Payment Gateway Integration Pending')">₹500</button>
                    <button class="bg-slate-100 text-textmain border border-slate-300 p-2 md:p-3 rounded-lg font-semibold cursor-pointer transition-all duration-200 hover:bg-primary hover:text-white hover:border-primary text-[0.85rem] md:text-[1rem]" onclick="alert('Payment Gateway Integration Pending')">Custom</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
function checkAndProceed() {
    const nameInput = document.getElementById('donorName').value.trim();
    const phoneInput = document.getElementById('donorPhone').value.trim();
    const errorDiv = document.getElementById('identify-error');
    
    if (!nameInput || !phoneInput) {
        errorDiv.innerHTML = 'Please enter both your name and phone number.';
        errorDiv.style.display = 'block';
        return;
    }
    
    errorDiv.style.display = 'none';
    const checkBtn = document.querySelector('#step-identify button');
    checkBtn.innerHTML = 'Verifying...';
    checkBtn.disabled = true;
    
    // Fetch contribution data (simulating backend check)
    fetch(`/check-contribution/?name=${encodeURIComponent(nameInput)}&phone=${encodeURIComponent(phoneInput)}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('step-identify').style.display = 'none';
            document.getElementById('step-pay').style.display = 'block';
            
            const statusDiv = document.getElementById('contribution-status');
            
            if (data.is_registered) {
                statusDiv.innerHTML = `<h4 class="text-[#065f46] mb-2 text-[1.1rem] font-bold"><i class="fas fa-check-circle"></i> Welcome back, ${data.name}!</h4>
                                       <div class="bg-white rounded-lg p-4 my-3 border border-[#a7f3d0]">
                                            <p class="mb-1 text-textmuted">Your Monthly Commitment: <strong class="text-textmain text-[1.1rem]">₹${data.commitment}</strong></p>
                                            <p class="m-0 text-textmuted">Total Paid to date: <strong class="text-[#10b981] text-[1.1rem]">₹${data.total_paid}</strong> 
                                            <span class="text-[0.85rem]">(across ${data.count} payments)</span></p>
                                       </div>
                                       <p class="text-[#047857] m-0 text-[0.95rem]">Please select or enter the amount you'd like to pay today.</p>`;
            } else if (data.count === 0) {
                statusDiv.innerHTML = `<h4 class="text-[#065f46] mb-2 text-[1.1rem] font-bold">Welcome, ${nameInput}!</h4>
                                       <p class="text-[#047857] m-0">You haven't made any monthly contributions yet. Start supporting our cause today!</p>`;
            } else {
                statusDiv.innerHTML = `<h4 class="text-[#065f46] mb-2 text-[1.1rem] font-bold">Welcome back, ${data.name}!</h4>
                                       <p class="text-[#047857] m-0">You have successfully contributed a total of <strong>₹${data.total_paid}</strong> towards the Monthly Fund across ${data.count} payment(s).</p>`;
            }
        })
        .catch(error => {
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = 'Error verifying details. Please try again.';
            checkBtn.innerHTML = 'Check Details & Pay';
            checkBtn.disabled = false;
        });
}
</script>
{% endblock %}
