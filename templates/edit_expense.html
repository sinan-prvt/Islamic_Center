{% extends 'base.html' %}

{% block title %}Edit Expense - SKSSF Administration{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[80vh]">
    <div class="container mx-auto px-4 max-w-[600px]">
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.05)]">
            <h2 class="text-[1.5rem] text-textmain mb-6 pb-2.5 border-b-2 border-slate-200 font-bold"><i class="fas fa-edit mr-2 text-red-500"></i> Edit Expense: {{ expense.title }}</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Title / Name</label>
                    {{ form.title }}
                </div>
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Category</label>
                    {{ form.category }}
                    <datalist id="categoryOptions">
                        <option value="Educational Program">
                        <option value="Relief">
                        <option value="Office">
                        <option value="Event">
                        <option value="Other">
                    </datalist>
                </div>
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Amount (₹)</label>
                    {{ form.amount }}
                </div>
                <div class="mb-5">
                    <label class="block mb-2 font-semibold text-textmuted text-[0.9rem]">Description</label>
                    {{ form.description }}
                </div>
                <button type="submit" class="w-full p-3 bg-red-500 text-white border-none rounded-lg font-bold cursor-pointer mt-4 transition-colors hover:bg-red-600">Save Changes</button>
                <a href="{% url 'manage_expenses' %}" class="w-full p-3 bg-slate-400 text-white border-none rounded-lg font-bold cursor-pointer mt-2 block text-center no-underline transition-colors hover:bg-slate-500">Cancel</a>
            </form>
        </div>
    </div>
</div>

<style>
    /* Styling for Django generated forms in this page */
    form input, form select, form textarea {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
    }
    form input:focus, form select:focus, form textarea:focus {
        border-color: #ef4444;
    }
</style>
{% endblock %}
