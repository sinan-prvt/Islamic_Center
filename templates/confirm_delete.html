{% extends 'base.html' %}

{% block title %}Confirm Delete - SKSSF Administration{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[80vh] flex items-center justify-center">
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.05)] text-center w-full max-w-[500px] border-t-[4px] border-t-red-500 mx-4 md:mx-auto">
        <h2 class="text-[1.3rem] md:text-[1.5rem] text-red-500 mb-4 font-bold"><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h2>
        <p class="text-textmuted mb-6 md:mb-8 text-[0.95rem] md:text-[1.1rem]">Are you sure you want to completely delete <strong class="font-bold text-textmain">"{{ object_name }}"</strong>? This action cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="flex gap-4">
                <a href="{% url cancel_url %}" class="flex-1 p-3 md:p-4 bg-slate-400 text-white border-none rounded-lg font-bold cursor-pointer no-underline text-[0.95rem] md:text-base text-center transition-colors hover:bg-slate-500">Cancel</a>
                <button type="submit" class="flex-1 p-3 md:p-4 bg-red-500 text-white border-none rounded-lg font-bold cursor-pointer text-[0.95rem] md:text-base transition-colors hover:bg-red-600">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
