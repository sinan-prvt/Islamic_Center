{% extends 'base.html' %}

{% block title %}Confirm Delete - SKSSF Administration{% endblock %}

{% block content %}
<style>
    .manage-section { padding: 4rem 0; background: #f8fafc; min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 100%; border-top: 4px solid #ef4444; }
    .form-card h2 { font-size: 1.5rem; color: #ef4444; margin-bottom: 1rem; }
    .form-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem; }
    .btn-group { display: flex; gap: 15px; }
    .btn-delete { flex: 1; padding: 1rem; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: background 0.3s; }
    .btn-delete:hover { background: #dc2626; }
    .btn-cancel { flex: 1; padding: 1rem; background: #94a3b8; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; text-decoration: none; }
</style>

<div class="manage-section">
    <div class="form-card">
        <h2><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h2>
        <p>Are you sure you want to completely delete <strong>"{{ object_name }}"</strong>? This action cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="btn-group">
                <a href="{% url cancel_url %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-delete">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
